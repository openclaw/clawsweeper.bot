name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: SemVer to release
        required: true
        type: string
      dry_run:
        description: Validate and test without publishing
        default: true
        type: boolean

permissions: {}

jobs:
  release:
    permissions:
      actions: read
      checks: read
      contents: write
      statuses: read
    uses: openclaw/release-workflows/.github/workflows/release-source.yml@a3c83188f344414c993f6a5e4b43f16317ffc6f0
    with:
      version: ${{ inputs.version || github.ref_name }}
      dry_run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
      require-signed-tag: true
      ci-check-events: '["push"]'
      test-command: node --test --test-concurrency=2 tests/*.test.mjs
      source-archives: true
